{% extends 'layout.html' %}
{% block content %}
<div class="signup-page-container">
    <div class="signup-card">
        <h2>Sign Up</h2>
        <p class="subtitle">Choose account type</p>
        
        <form action="/signup" method="post">
            <!-- All 3 selection options contained properly inside the card -->
            <div class="account-type-grid">
                <label class="type-card">
                    <input type="radio" name="account_type" value="parent" required>
                    <div class="card-content">
                        <span>Parents or Caregivers</span>
                    </div>
                </label>

                <label class="type-card">
                    <input type="radio" name="account_type" value="student" checked required>
                    <div class="card-content">
                        <span>Student</span>
                    </div>
                </label>

                <label class="type-card">
                    <input type="radio" name="account_type" value="staff" required>
                    <div class="card-content">
                        <span>School Staff</span>
                    </div>
                </label>
            </div>

            <!-- Credentials Input Fields -->
            <div class="credential-fields">
                <div class="input-group">
                    <label for="email">School Email</label>
                    <input type="email" id="email" name="email" required placeholder="name@school.com">
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>
            </div>

            <div class="help-section">
                <a href="#" class="help-link">Help</a>
                <p style="margin: 0; font-size: 0.9em;">Already have an account? <a href="{{ url_for('login') }}" class="help-link">Login here</a></p>
            </div>
            
            <button type="submit" class="signup-submit-btn">Create Account & Enter</button>
        </form>
    </div>
</div>
{% endblock %}
